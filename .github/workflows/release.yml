name: Release

# Push a tag like v1.0.0 to build the executables and attach them to a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests
      - run: python -m pip install pyinstaller
      - run: python build.py
      - name: Name the Linux binary
        if: runner.os == 'Linux'
        run: mv dist/DispatchRPM dist/DispatchRPM-linux
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
