[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dispatch-rpm"
dynamic = ["version"]
description = "Rate-per-mile calculator for US truck dispatchers"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []

[project.gui-scripts]
dispatch-rpm = "dispatch_rpm.app:main"

[tool.setuptools]
packages = ["dispatch_rpm"]

[tool.setuptools.package-data]
dispatch_rpm = ["static/*"]

[tool.setuptools.dynamic]
version = { attr = "dispatch_rpm.__version__" }
